x-postgres-common:
  &postgres-common
  image: postgres:17
  environment:
    POSTGRES_DB: ${DB_NAME:-appdb}
    POSTGRES_USER: ${DB_USER:-app}
    POSTGRES_PASSWORD: ${DB_PASSWORD:-app_password}
  volumes:
    - ./db:/docker-entrypoint-initdb.d:ro
  networks:
    - dbnet
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -h localhost -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
    interval: 5s
    timeout: 5s
    retries: 5

x-webapp-common:
  &webapp-common
  build: .
  restart: unless-stopped
  env_file:
    - path: .env
      required: false
  environment:
    &webapp-common-env
    PORT: 8000
    DB_PORT: 5432
    DB_NAME: ${DB_NAME:-appdb}
    DB_USER: ${DB_USER:-app}
    DB_PASSWORD: ${DB_PASSWORD:-app_password}
    CENTRAL_SITE_URL: http://web-central:8000
    LEAF1_SITE_URL: http://web-child1:8000
    LEAF2_SITE_URL: http://web-child2:8000
    CENTRAL_DB_HOST: db-central-node
    LEAF1_DB_HOST: db-child-1
    LEAF2_DB_HOST: db-child-2
  networks:
    - dbnet

services:
  node1:
    <<: *postgres-common
    container_name: db-central-node
    hostname: db-central-node
    ports:
      - "5441:5432"
    volumes:
      - node1_data:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro

  node2:
    <<: *postgres-common
    container_name: db-child-1
    hostname: db-child-1
    ports:
      - "5442:5432"
    volumes:
      - node2_data:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    depends_on:
      node1:
        condition: service_healthy

  node3:
    <<: *postgres-common
    container_name: db-child-2
    hostname: db-child-2
    ports:
      - "5443:5432"
    volumes:
      - node3_data:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    depends_on:
      node1:
        condition: service_healthy

  webapp-1:
    <<: *webapp-common
    container_name: web-central
    hostname: web-central
    environment:
      <<: *webapp-common-env
      SITE_ID: site1
      DB_HOST: db-central-node
    ports:
      - "8081:8000"
    depends_on:
      node1:
        condition: service_healthy

  webapp-2:
    <<: *webapp-common
    container_name: web-child1
    hostname: web-child1
    environment:
      <<: *webapp-common-env
      SITE_ID: site2
      DB_HOST: db-child-1
    ports:
      - "8082:8000"
    depends_on:
      node2:
        condition: service_healthy

  webapp-3:
    <<: *webapp-common
    container_name: web-child2
    hostname: web-child2
    environment:
      <<: *webapp-common-env
      SITE_ID: site3
      DB_HOST: db-child-2
    ports:
      - "8083:8000"
    depends_on:
      node3:
        condition: service_healthy

networks:
  dbnet:

volumes:
  node1_data:
  node2_data:
  node3_data:
